name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise the image
        run: |
          docker build -t ai-guard-gateway .
          docker run -d --name guard -p 8080:8080 -e MOCK_UPSTREAM=1 ai-guard-gateway
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/health
          curl -sf http://127.0.0.1:8080/v1/redact \
            -H 'Content-Type: application/json' \
            -d '{"text":"Customer 10000000146"}' > /tmp/redacted.json
          python -c "import json; data=json.load(open('/tmp/redacted.json')); assert data['redacted_text']=='Customer [TCKN_1]'; assert '10000000146' not in json.dumps(data)"
