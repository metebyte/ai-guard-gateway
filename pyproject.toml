[project]
name = "ai-guard-gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway that redacts Turkish and English PII before prompts leave the company."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "metebyte" }]
keywords = ["pii", "kvkk", "gdpr", "openai", "gateway", "fastapi"]
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.6",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-guard-gateway = "aiguard.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
